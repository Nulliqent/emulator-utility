name: console-ci

on:
  push:
    branches: [main]
    paths: ["console/**", "docker-compose.yaml", "Dockerfile/**", ".github/workflows/console-ci.yml"]
  pull_request:
    paths: ["console/**", "docker-compose.yaml", "Dockerfile/**", ".github/workflows/console-ci.yml"]

permissions:
  contents: read

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: console/.refs
          key: refs-${{ hashFiles('console/refs.json') }}
      - run: pnpm install --frozen-lockfile
      # The reference repos are third-party and read-only: fetched at the pins in console/refs.json.
      - run: pnpm refs:fetch aws-emulator
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm catalog:check

  e2e:
    # The Emulator image downloads the aarch64 package, so this needs an arm runner. Arm runners are free
    # for public repos only; if the repo goes private, use ubuntu-latest with docker/setup-qemu-action (slow).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.arch }}-${{ hashFiles('console/pnpm-lock.yaml') }}
      - run: pnpm --filter @console/e2e exec playwright install --with-deps chromium
      # Starts its own compose project (console-e2e) on ports 19297 and 19300; see console/e2e/compose.e2e.yaml.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: console/e2e/test-results
          retention-days: 7
