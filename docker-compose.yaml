services:
  emulator:
    build:
      context: .
      dockerfile: Dockerfile/emulator.Dockerfile
    image: aws-emulator
    container_name: emulator
    command: ["-p", "${PORT:-9297}"]
    ports:
      - "127.0.0.1:${PORT:-9297}:${PORT:-9297}"
    volumes:
      - .aws/emulator:/home/emulator/.aws/emulator
    mem_limit: 2g
    memswap_limit: 2g

  console:
    build:
      context: ./console
      dockerfile: apps/gateway/Dockerfile
      args:
        # build (default): compile the SPA in Docker, which needs RAM (see README). prebuilt: use the host's dist.
        WEB_SOURCE: ${CONSOLE_WEB_SOURCE:-build}
      additional_contexts:
        # The apps/web folder; only read when WEB_SOURCE=prebuilt. Run `pnpm --dir console build` first.
        webdist: ${CONSOLE_WEBDIST:-./console/apps/web}
    image: aws-emulator-console
    # The Emulator (uid 1000) writes ca.pem and the credentials as 0600; the Gateway must be uid 1000 to read them.
    user: "1000:1000"
    depends_on:
      - emulator
    environment:
      CONSOLE_EMULATOR_URL: https://emulator:${PORT:-9297}
      CONSOLE_EMULATOR_HOME: /emulator-home
      CONSOLE_PUBLIC_ORIGIN: http://127.0.0.1:9300
    volumes:
      - .aws/emulator:/emulator-home:ro
      - console-data:/data
    ports:
      - "127.0.0.1:9300:9300"
    mem_limit: 256m

volumes:
  console-data:
